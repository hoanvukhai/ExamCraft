services:
  db:
    image: postgres:16-alpine
    container_name: examcraft_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examcraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examcraft_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-examcraft}
    ports:
      # Cổng ánh xạ ra ngoài: mặc định 5436 để không trùng với các container khác
      - "${POSTGRES_PORT:-5436}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examcraft} -d ${POSTGRES_DB:-examcraft}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
