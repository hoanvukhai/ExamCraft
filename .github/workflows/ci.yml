name: ExamCraft CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    name: Regression Tests & Build Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: examcraft
          POSTGRES_PASSWORD: examcraft_secret_ci
          POSTGRES_DB: examcraft_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://examcraft:examcraft_secret_ci@localhost:5432/examcraft_ci?schema=public"
      SESSION_SECRET: "ci_temporary_test_session_secret_key_random_for_github_actions_12345"
      NODE_ENV: "test"
      NEXT_BUILD_CPUS: "1"
      NODE_OPTIONS: "--max-old-space-size=1024"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Database Schema
        run: npx prisma db push --skip-generate

      - name: Seed Database
        run: npx tsx prisma/seed.ts

      - name: Create isolated integration database
        run: psql "${DATABASE_URL%%\?*}" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE examcraft_test_20261022'

      - name: Prepare isolated integration schema
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "postgresql://examcraft:examcraft_secret_ci@localhost:5432/examcraft_test_20261022?schema=public"

      - name: Run Unit & Regression Tests
        run: npm test

      - name: Run isolated transaction tests
        run: npm run test:integration

      - name: Run Next.js Production Build
        run: npm run build
        env:
          NODE_ENV: production
          SESSION_SECRET: "ci_prod_build_valid_session_secret_32_bytes_super_secure"

      - name: Start isolated HTTP server
        shell: bash
        env:
          NODE_ENV: production
        run: |
          ci_report="qa/rebuild-$(date -u +%F)"
          mkdir -p "$ci_report" tmp
          node --import tsx scripts/test-server.cjs --production > "$ci_report/ci-server.log" 2>&1 &
          echo $! > tmp/ci-server.pid
          node -e 'const retry=async()=>{for(let i=0;i<60;i++){try{const r=await fetch("http://127.0.0.1:3117/api/health");if(r.ok&&(await r.json()).isolatedTest===true)return;}catch{}await new Promise(r=>setTimeout(r,1000));}throw Error("Isolated server did not become ready");};retry().catch(()=>process.exit(1));'

      - name: Run isolated HTTP workflows
        run: npm run test:http

      - name: Stop isolated HTTP server
        if: always()
        shell: bash
        run: |
          if [ -f tmp/ci-server.pid ]; then
            kill "$(cat tmp/ci-server.pid)" || true
          fi
